services:
  unmonitarr:
    image: ghcr.io/unmonitarr/unmonitarr:latest
    container_name: unmonitarr
    ports:
      - "5099:5099"  # Webhook server port
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5099/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    environment:
      # --- General ---
      - TZ=Australia/Melbourne           # Timezone for log timestamps (date maths is always UTC)
      - LOG_LEVEL=INFO                   # DEBUG, INFO, WARNING, ERROR
      - SLEEP_MINUTES=30                 # Minutes between scheduled runs
      - DELAY_MINUTES=120                # Minutes after air/release before re-monitoring (negative = early)
      - AUTO_TAG_NAME=auto-unmonitored   # Marks items unmonitarr manages (letters, numbers and - only)
      - IGNORE_TAG_NAME=ignore           # Items with this tag are never touched
      - SKIP_IF_FILE=1                   # Leave items that already have a file (1=yes, 0=no)
      - DRY_RUN=1                        # 1 = log what would change, 0 = apply changes

      # --- Radarr ---
      - ENABLE_RADARR=1                  # 1=enabled, 0=disabled
      - RADARR_URL=http://radarr:7878    # Container name or IP; localhost is the unmonitarr container
      - RADARR_API_KEY=${RADARR_API_KEY} # Settings > General > Security
      - PREFERRED_RELEASE=either         # either, digital or physical
      - IGNORE_INCINEMAS=0               # 1 = wait for a digital/physical date, never use cinema + 90 days
      - RADARR_REMONITOR_WINDOW_DAYS=30  # Only re-monitor movies released within this many days (0 = no limit)

      # --- Sonarr ---
      - ENABLE_SONARR=1                  # 1=enabled, 0=disabled
      - SONARR_URL=http://sonarr:8989    # Container name or IP; localhost is the unmonitarr container
      - SONARR_API_KEY=${SONARR_API_KEY} # Settings > General > Security
      - SONARR_REMONITOR_WINDOW_DAYS=14  # Only re-monitor episodes aired within this many days (0 = no limit)
      - SEASON_PACK_MODE=0               # Re-monitor whole seasons for tagged series (1=enabled, 0=disabled)
      - SEASON_PACK_MODE_TAG=season-pack # Tag for series that use season pack mode
      - SONARR_REFRESH_TBA=0             # Refresh metadata for aired episodes still titled TBA (1=enabled, 0=disabled)
    restart: unless-stopped
